name: Release

# 推 v* tag（例如 v0.2.0）時編譯，建立草稿 Release；說明從 CHANGELOG.md 貼上後再手動發佈。
# 按下「發佈」會觸發 site.yml：把這版的 .exe 放上官網（/download/）、更新 feed.json、部署到 Cloudflare Pages。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "PinPin-Notes-$version-x64.exe"
          Copy-Item target/release/pinpin.exe $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File "$name.sha256" -Encoding ascii
          "ASSET=$name" | Out-File $env:GITHUB_ENV -Append
          "### $name`n- sha256: $((Get-FileHash $name -Algorithm SHA256).Hash.ToLower())`n- 發佈這個草稿後，site.yml 會把它放上官網並更新 feed.json" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PinPin Notes ${{ github.ref_name }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
