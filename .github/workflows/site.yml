name: Site

# The website is built and deployed by Cloudflare Pages' own Git integration
# (project pinpin-notes, root directory site/, see docs/RELEASING.md): every push to main redeploys it.
#
# Publishing a GitHub Release doesn't push to main, so this asks Cloudflare to rebuild through a
# deploy hook. The build (site/scripts/fetch-release.mjs) then points the download button
# and feed.json at the new release.
#
# Needs repository secret CLOUDFLARE_DEPLOY_HOOK (Cloudflare → pinpin-notes → Settings → Builds → Deploy hooks).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK not set — rebuild the site in Cloudflare by hand (Deployments → Retry)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Cloudflare Pages build triggered"
