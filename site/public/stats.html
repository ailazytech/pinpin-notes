<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>PinPin Notes · Usage</title>
<link rel="icon" href="./favicon.ico" sizes="any" />
<style>
  :root { --bg: #fbf6ee; --card: #fff; --ink: #3a2e28; --muted: #8a7a70; --accent: #e8a33d; --bar: #f2c46d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #191512; --card: #241e1a; --ink: #f1e8df; --muted: #a8998e; --bar: #c98f2e; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; display: flex; gap: 10px; align-items: center; }
  h1 img { width: 32px; height: 32px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 20px; box-shadow: 0 2px 10px #0000000d; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .kpi b { display: block; font-size: 34px; line-height: 1.1; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 160px; margin-top: 10px; }
  .chart div { flex: 1; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .chart div:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 2px 6px; border-radius: 6px; font-size: 12px; white-space: nowrap; margin-bottom: 4px; }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 4px 0; } td:last-child { text-align: right; color: var(--muted); }
  h2 { font-size: 15px; margin: 0 0 8px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid #0002; background: var(--card); color: var(--ink); font: inherit; }
  button { padding: 9px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .err { color: #c0392b; margin: 0 0 16px; }
  @media (max-width: 640px) { .kpis, .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1><img src="./favicon-32.png" alt="" /> PinPin Notes · Usage</h1>
  <p class="sub">Anonymous, at most one ping per install per day. Unique installs, last 30 days. <span id="gen"></span></p>
  <form id="f"><input id="key" type="password" placeholder="Stats key" autocomplete="current-password" /><button>Show</button></form>
  <p class="err" id="err" hidden></p>
  <section id="out" hidden>
    <div class="kpis">
      <div class="card kpi"><b id="today">0</b><span>Today</span></div>
      <div class="card kpi"><b id="last7">0</b><span>Last 7 days</span></div>
      <div class="card kpi"><b id="last30">0</b><span>Last 30 days</span></div>
    </div>
    <div class="card"><h2>Daily active installs</h2><div class="chart" id="chart"></div><div class="axis"><span id="first"></span><span id="last"></span></div></div>
    <div class="grid">
      <div class="card"><h2>Version</h2><table id="versions"></table></div>
      <div class="card"><h2>Language</h2><table id="languages"></table></div>
      <div class="card"><h2>Windows</h2><table id="windows"></table></div>
      <div class="card"><h2>Country</h2><table id="countries"></table></div>
    </div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  $("key").value = localStorage.getItem("pinpin-stats-key") || "";
  async function load() {
    const key = $("key").value.trim();
    if (!key) return;
    $("err").hidden = true;
    const res = await fetch("./api/stats", { headers: { authorization: "Bearer " + key } });
    const data = await res.json().catch(() => ({ error: "HTTP " + res.status }));
    if (!res.ok) { $("err").textContent = data.error || "HTTP " + res.status; $("err").hidden = false; return; }
    localStorage.setItem("pinpin-stats-key", key);
    $("out").hidden = false;
    $("gen").textContent = "Updated " + new Date(data.generated).toLocaleString();
    for (const k of ["today", "last7", "last30"]) $(k).textContent = data[k];
    const max = Math.max(1, ...data.daily.map((d) => d.users));
    $("chart").innerHTML = data.daily.map((d) => `<div style="height:${(d.users / max) * 100}%" data-tip="${esc(d.day)}: ${d.users}"></div>`).join("");
    $("first").textContent = data.daily[0]?.day || "";
    $("last").textContent = data.daily.at(-1)?.day || "";
    for (const k of ["versions", "languages", "windows", "countries"])
      $(k).innerHTML = data[k].map((r) => `<tr><td>${esc(r.name)}</td><td>${r.count}</td></tr>`).join("") || "<tr><td>—</td><td></td></tr>";
  }
  $("f").addEventListener("submit", (e) => { e.preventDefault(); load(); });
  if ($("key").value) load();
</script>
</body>
</html>
